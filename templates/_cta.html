{% import "_macros.html" as m with context %}
<section class="section">
  <div class="wrap">
    <div class="cta-card">
      <div class="tile tile-cta" aria-hidden="true"></div>
      <div class="cta-body">
        <h2 class="h2">{{ t.home.cta_heading }}</h2>
        <p>{{ t.home.cta_text }}</p>
        <div class="actions">
          <a class="btn btn-accent" href="{{ path('contact') }}">{{ t.ui.cta_contact }} {{ m.icon("arrow", "ico ico-sm") }}</a>
          <a class="btn btn-ghost-light" href="mailto:{{ site.email }}">{{ m.icon("mail", "ico ico-sm") }} {{ site.email }}</a>
        </div>
      </div>
    </div>
  </div>
</section>
