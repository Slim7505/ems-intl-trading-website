{% macro icon(name, cls="ico") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "arrow" -%}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "mail" -%}<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/>
{%- elif name == "phone" -%}<path d="M5 3h3l2 5-2.5 1.5a11 11 0 0 0 7 7L16 14l5 2v3a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/>
{%- elif name == "fax" -%}<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="9" rx="2"/><path d="M7 15h10v6H7z"/>
{%- elif name == "pin" -%}<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>
{%- elif name == "clock" -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "menu" -%}<path d="M4 8h16M4 16h16"/>
{%- elif name == "close" -%}<path d="M6 6l12 12M18 6L6 18"/>
{%- elif name == "truck" -%}<path d="M2 6h11v10H2zM13 9h4l4 4v3h-8"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>
{%- elif name == "tag" -%}<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>
{%- elif name == "plate" -%}<circle cx="12" cy="13" r="7"/><circle cx="12" cy="13" r="3.5"/><path d="M3 4v5M5 4v5M4 9v11M20 4c-2 1-2 5 0 6v10"/>
{%- elif name == "plane" -%}<path d="M10.5 13.5L3 11l1.5-1.5 8 1L17 6c1-1 3-1.5 3.5-1s0 2.5-1 3.5l-4.5 4.5 1 8L14.5 22 12 14.5"/>
{%- elif name == "check" -%}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == "globe" -%}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro logo(cls="logo") -%}
<svg class="{{ cls }}" viewBox="0 0 132 40" aria-hidden="true" focusable="false">
  <defs><radialGradient id="g{{ cls|replace(' ','') }}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffc06b"/><stop offset=".55" stop-color="#ef7d1f"/><stop offset="1" stop-color="#c4520e"/></radialGradient></defs>
  <text x="0" y="29" font-family="'Fraunces', Georgia, serif" font-weight="700" font-size="30" letter-spacing="-1" fill="#d4352b">ems</text>
  <g transform="translate(76 20)">
    <circle r="16" fill="url(#g{{ cls|replace(' ','') }})"/>
    <g fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"><ellipse rx="7" ry="16"/><path d="M-16 0h32M-14 -8h28M-14 8h28"/></g>
  </g>
</svg>
{%- endmacro %}

{% macro img(name, alt, cls="", loading="lazy") -%}
{%- set d = site.images[name] -%}
<img class="{{ cls }}" src="{{ root }}assets/img/{{ name }}.webp" width="{{ d[0] }}" height="{{ d[1] }}" alt="{{ alt }}" loading="{{ loading }}" decoding="async"{% if loading == "eager" %} fetchpriority="high"{% endif %}>
{%- endmacro %}
