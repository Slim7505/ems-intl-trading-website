{% import "_macros.html" as m with context %}
<section class="page-head">
  <div class="wrap page-head-inner">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="{{ path('home') }}">{{ t.ui.nav.home }}</a><span aria-hidden="true">›</span><span>{{ t.ui.nav[slug] }}</span></nav>
    <p class="eyebrow">{{ P.eyebrow }}</p>
    <h1 class="display display-md">{{ P.heading }}</h1>
    {% if P.lead is defined %}<p class="lead">{{ P.lead }}</p>{% endif %}
  </div>
</section>
