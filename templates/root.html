<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ strings.ja.meta.site_name }} | EMS International Trading Co., Ltd.</title>
<meta name="description" content="{{ strings.ja.meta.pages.home.description }}">
<link rel="canonical" href="{{ alt.ja }}">
{% for l in langs %}<link rel="alternate" hreflang="{{ l }}" href="{{ alt[l] }}">
{% endfor %}<link rel="alternate" hreflang="x-default" href="{{ alt.ja }}">
<link rel="icon" href="{{ root }}assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ root }}assets/css/site.css">
<script>
(function(){var s={{ langs|tojson }},p=(navigator.languages||[navigator.language||"ja"]).map(function(x){return (x||"").slice(0,2).toLowerCase()}),c="ja";
for(var i=0;i<p.length;i++){if(s.indexOf(p[i])>-1){c=p[i];break}}location.replace({{ root|tojson }}+c+"/");})();
</script>
</head>
<body class="chooser">
<main class="chooser-main">
  <svg class="chooser-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#ef7d1f"/><g fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.3"><ellipse cx="20" cy="20" rx="8" ry="18"/><path d="M2 20h36M4 11h32M4 29h32"/></g></svg>
  <h1 class="display display-md">EMS International Trading</h1>
  <ul class="chooser-list">
    {% for l in langs %}<li><a href="{{ root }}{{ l }}/" hreflang="{{ l }}" lang="{{ l }}">{{ site.lang_label[l] }}</a></li>{% endfor %}
  </ul>
</main>
</body>
</html>
